[package]
name = "gyroscope"
version = "0.2.10"
description = "Windows 11 desktop RSS/Atom widget"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Enables tauri's built-in production asset server (embedded `dist/` via a
# custom protocol handler) instead of loading `devUrl`. `tauri dev` never
# turns this on -- it wants the Vite dev server -- but any build meant to
# run standalone (`npm run tauri build`, `npm run package:portable`) must
# enable it explicitly, or the compiled exe still tries to fetch
# http://localhost:1420 and shows a connection-refused blank window
# (found via user report: portable exe launched with no Vite server
# running showed exactly this). DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gyroscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-notification = "2.3.3"
tauri-plugin-window-state = "2.4.1"
# Native Open/Save dialogs for OPML import/export -- we deliberately do NOT
# add tauri-plugin-fs alongside it: reading/writing the user-picked path is
# done with plain std::fs inside our own commands, which needs no ACL scope
# (Tauri's fs ACL only gates the fs *plugin's* own JS-invokable commands).
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "gzip", "brotli", "json"] }
feed-rs = "2.4.0"
rusqlite = { version = "0.40.1", features = ["bundled", "chrono", "backup"] }
scraper = "0.27.0"
# Scraper's tree API is built on ego-tree, but the crate doesn't re-export
# its NodeRef -- the article full-text extractor (fetch/article.rs) walks
# the tree directly, so it needs this as a direct dependency. Pinned to the
# version already resolved transitively to avoid a second copy.
ego-tree = "0.11"
quick-xml = "0.41.0"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.19"
url = "2.5.8"
semver = "1.0.28"
percent-encoding = "2.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.8.0"
raw-window-handle = "0.6"
# Pinned to match the version already resolved transitively via wry/webview2-com-sys,
# to avoid compiling a second copy of windows-sys.
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
# Reads the real face names (PostScript names, nameID 6) out of every
# installed font's name table so the renderer can build @font-face src:local()
# lists that Chromium/WebView2 actually matches. local() looks up *face* names,
# not reliably family names (the Yu / SAO UI bug), and fontdb scans both the
# system and per-user font directories on Windows, so HKCU-registered fonts
# (like SAO UI) are covered. On Windows `load_system_fonts` is the only API
# used; `memmap` just makes that scan faster.
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "memmap"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
mediatype = "0.21.0"
