<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- 角丸背景 -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" />

  <!-- ジャイロスコープのジンバル外輪と回転軸（全体38deg傾き） -->
  <g transform="rotate(38 256 256)">
    <!-- ジンバルリング（上下の軸の付け根までしっかり伸びる2つの円弧） -->
    <path
      d="M 190 88 A 180 180 0 0 0 190 424"
      fill="none"
      stroke="url(#ring)"
      stroke-width="28"
      stroke-linecap="round"
    />
    <path
      d="M 322 424 A 180 180 0 0 0 322 88"
      fill="none"
      stroke="url(#ring)"
      stroke-width="28"
      stroke-linecap="round"
    />

    <!-- 上下の回転軸（スピンドル） -->
    <line x1="256" y1="54" x2="256" y2="112" stroke="#fbbf24" stroke-width="24" stroke-linecap="round" />
    <line x1="256" y1="400" x2="256" y2="458" stroke="#fbbf24" stroke-width="24" stroke-linecap="round" />
    <circle cx="256" cy="54" r="16" fill="#fbbf24" />
    <circle cx="256" cy="458" r="16" fill="#fbbf24" />
  </g>

  <!-- 中央のシャープな白の「G」 -->
  <path
    d="M 326 188 A 102 102 0 1 0 358 260 L 256 260"
    fill="none"
    stroke="#f8fafc"
    stroke-width="46"
    stroke-linecap="butt"
    stroke-linejoin="miter"
  />
</svg>
